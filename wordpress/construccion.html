<style>
  :root{
    --fondo:#fdf6f3; --nude-hero:#efd3c8; --nude-suave:#f3dfd6;
    --tinta:#3a2a26; --tinta-suave:#523a33; --cobre:#8a4b40;
    --boton:#cc8791; --boton-hover:#bd7580; --linea:rgb(138 90 79 / .22);
    --f-titulo:'Big Caslon','BigCaslon-Medium','Libre Caslon Text','Baskerville',Georgia,serif;
    --f-texto:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--f-texto); color:var(--tinta); line-height:1.6;
    background:
      radial-gradient(60rem 40rem at 85% -10%, var(--nude-hero) 0%, transparent 60%),
      radial-gradient(50rem 36rem at -10% 110%, var(--nude-suave) 0%, transparent 60%),
      var(--fondo);
    display:flex; flex-direction:column; min-height:100vh;
  }
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px}
  .card{width:100%;max-width:640px;text-align:center}
  .logo{width:min(320px,72vw);height:auto;margin:0 auto 40px;display:block}
  .tag{
    display:inline-block;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--cobre);border:1px solid var(--linea);border-radius:999px;padding:7px 18px;margin-bottom:26px;
    background:rgb(255 255 255 / .45);
  }
  h1{font-family:var(--f-titulo);font-weight:400;font-size:clamp(2rem,6vw,3.1rem);line-height:1.15;margin-bottom:18px}
  h1 em{font-style:italic;color:var(--cobre)}
  .lead{font-weight:300;font-size:clamp(1rem,2.4vw,1.15rem);color:var(--tinta-suave);max-width:46ch;margin:0 auto}
  .divider{width:56px;height:1px;background:var(--cobre);opacity:.5;margin:36px auto}
  .contact{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{
    display:inline-flex;align-items:center;gap:10px;text-decoration:none;
    font-weight:500;font-size:.95rem;padding:13px 24px;border-radius:6px;
    background:var(--boton);color:#fff;transition:background .2s,transform .2s;
  }
  .btn:hover{background:var(--boton-hover);transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--tinta);border:1px solid var(--linea)}
  .btn.ghost:hover{background:rgb(255 255 255 / .6)}
  .btn svg{width:18px;height:18px;fill:currentColor;flex:none}
  .info{margin-top:26px;font-size:.95rem;color:var(--tinta-suave)}
  .info p+p{margin-top:4px}
  footer a{color:var(--cobre);text-decoration:none;border-bottom:1px solid var(--linea)}
  footer a:hover{border-bottom-color:var(--cobre)}
  [hidden]{display:none!important}
  footer{padding:22px 20px;text-align:center;font-size:.82rem;color:var(--tinta-suave);border-top:1px solid var(--linea)}
  @media (prefers-reduced-motion:no-preference){
    .card>*{opacity:0;transform:translateY(10px);animation:in .7s ease forwards}
    .card>*:nth-child(2){animation-delay:.08s}.card>*:nth-child(3){animation-delay:.16s}
    .card>*:nth-child(4){animation-delay:.24s}.card>*:nth-child(5){animation-delay:.32s}
    .card>*:nth-child(6){animation-delay:.4s}.card>*:nth-child(7){animation-delay:.48s}
    @keyframes in{to{opacity:1;transform:none}}
  }
</style>
</head>

<footer>© <span id="y"></span> Armodent · armodent.cl · Diseño web por <a href="https://diseñopaginas.cl" target="_blank" rel="noopener">DiseñoPaginas.cl</a></footer>

<script>
  /* ===== DATOS DE CONTACTO: completar y subir. Los campos vacíos no se muestran. ===== */
  const CONTACTO = {
    whatsapp:  "",   // ej: "56912345678" (código país + número, sin + ni espacios)
    telefono:  "",   // ej: "+56 9 1234 5678"
    email:     "",   // ej: "contacto@armodent.cl"
    direccion: "",   // ej: "Calle 123, Concepción"
    horario:   "",   // ej: "Lunes a viernes, 9:00 a 19:00"
    instagram: ""    // ej: "armodent.cl"
  };
  /* ===================================================================================== */
  const ico = {
    wa:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.8 14.2c-.2.7-1.4 1.3-1.9 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.1-.2-1.2-1.6-1.2-3s.8-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.2-.3.4-.1.7.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.7-.1.2-.3.8-.9 1-1.2.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.8-.1 1.5Z"/></svg>',
    tel:'<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1l-2.25 2.2Z"/></svg>',
    mail:'<svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5-8-5V6l8 5 8-5v2Z"/></svg>',
    ig:'<svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm5 5.5A4.5 4.5 0 1 0 12 16.5 4.5 4.5 0 0 0 12 7.5Zm0 2A2.5 2.5 0 1 1 12 14.5 2.5 2.5 0 0 1 12 9.5Zm5.2-3.2a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2Z"/></svg>'
  };
  const d = s => (s||"").replace(/\D/g,"");
  const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const b = [], c = CONTACTO;
  if (c.whatsapp) b.push(`<a class="btn" href="https://wa.me/${d(c.whatsapp)}" target="_blank" rel="noopener">${ico.wa}Escríbenos por WhatsApp</a>`);
  if (c.telefono) b.push(`<a class="btn ${c.whatsapp?'ghost':''}" href="tel:+${d(c.telefono)}">${ico.tel}${esc(c.telefono)}</a>`);
  if (c.email)    b.push(`<a class="btn ghost" href="mailto:${esc(c.email)}">${ico.mail}${esc(c.email)}</a>`);
  if (c.instagram)b.push(`<a class="btn ghost" href="https://instagram.com/${esc(c.instagram.replace('@',''))}" target="_blank" rel="noopener">${ico.ig}@${esc(c.instagram.replace('@',''))}</a>`);
  document.getElementById('botones').innerHTML = b.join('');
  const i = [];
  if (c.direccion) i.push(`<p>${esc(c.direccion)}</p>`);
  if (c.horario)   i.push(`<p>${esc(c.horario)}</p>`);
  document.getElementById('info').innerHTML = i.join('');
  if (!b.length && !i.length) document.querySelector('.divider').hidden = true;
  document.getElementById('y').textContent = new Date().getFullYear();
</script>
