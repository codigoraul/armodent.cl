name: Deploy a armodent.cl/prueba

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (base /prueba)
        run: npm run build
        env:
          PUBLIC_WP_URL: https://armodent.cl/admin
          DEPLOY_BASE: /prueba

      - name: Evitar indexación de /prueba
        run: printf '<IfModule mod_headers.c>\n  Header set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n' > dist/.htaccess

      - name: Subir por FTP (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" \
            -e "set ssl:verify-certificate no; set ftp:ssl-allow yes; set net:max-retries 5; set net:reconnect-interval-base 5; set net:timeout 20; mirror -R --delete --verbose ./dist /prueba; bye" \
            "$FTP_SERVER"
