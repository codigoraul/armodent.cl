name: Deploy a armodent.cl/prueba

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (base /prueba)
        run: npm run build
        env:
          PUBLIC_WP_URL: https://armodent.cl/admin
          DEPLOY_BASE: /prueba

      - name: .htaccess (HTTPS + evitar indexación de /prueba)
        run: |
          cat > dist/.htaccess <<'HTACCESS'
          # Forzar HTTPS
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{HTTPS} !=on
            RewriteCond %{HTTP:X-Forwarded-Proto} !https
            RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
          </IfModule>

          # No indexar /prueba
          <IfModule mod_headers.c>
            Header set X-Robots-Tag "noindex, nofollow"
          </IfModule>
          HTACCESS

      - name: Subir por FTP (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" \
            -e "set ssl:verify-certificate no; set ftp:ssl-allow yes; set net:max-retries 5; set net:reconnect-interval-base 5; set net:timeout 20; mirror -R --delete --verbose ./dist /prueba; bye" \
            "$FTP_SERVER"
