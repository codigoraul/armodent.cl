name: Deploy a armodent.cl

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lo dispara WordPress (plugin Armodent Headless) al crear, editar, borrar o reordenar contenido
  repository_dispatch:
    types: [wp-update]

# Un solo despliegue a la vez: si llegan varios cambios seguidos,
# termina el actual y corre solo el último pendiente.
concurrency:
  group: deploy-armodent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (producción, raíz del dominio)
        run: npm run build
        env:
          PUBLIC_WP_URL: https://armodent.cl/admin

      # /prueba deja de usarse: todo lo que entre ahí se redirige (301) al sitio principal
      - name: Redirección de /prueba al sitio principal
        run: |
          mkdir -p redir-prueba
          cat > redir-prueba/.htaccess <<'HTACCESS'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteRule ^(.*)$ https://armodent.cl/$1 [R=301,L]
          </IfModule>
          HTACCESS

      # IMPORTANTE: en la raíz NO se usa --delete (borraría WordPress en /admin, cgi-bin, .well-known, etc.)
      # y no se sube .htaccess (el de la raíz lo administra cPanel).
      # Solo la carpeta de assets /_astro se sincroniza con --delete para no acumular archivos viejos.
      - name: Subir por FTP (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
          set ftp:ssl-allow no;
          set net:max-retries 5;
          set net:reconnect-interval-base 5;
          set net:reconnect-interval-multiplier 1;
          set net:timeout 20;
          set ftp:passive-mode true;
          set mirror:parallel-directories false;
          open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
          mirror -R --parallel=1 --verbose --exclude-glob .htaccess --exclude-glob _astro/ dist/ /;
          mirror -R --delete --parallel=1 --verbose dist/_astro/ /_astro/;
          mirror -R --parallel=1 --verbose redir-prueba/ /prueba/;
          "
